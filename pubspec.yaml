name: roadwise_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  googleapis_auth:
  font_awesome_flutter: ^10.7.0
  http: 0.13.6
  firebase_messaging: ^15.1.1
  google_maps_flutter: ^2.0.0
  cupertino_icons: ^1.0.2
  animate_do: ^3.3.3
  page_transition: ^2.1.0
  firebase_auth: ^5.2.1
  firebase_storage: ^12.3.0
  firebase_core: ^3.4.1
  flare_flutter: ^3.0.2
  image_picker: ^1.0.7
  fluttertoast: ^8.2.8
  ndialog: ^4.1.1+1
  intl: ^0.19.0
  path_provider: ^2.0.11
  cloud_firestore: ^5.4.1
  cherry_toast: ^1.9.1
  loading_animation_widget: ^1.2.1
  icons_plus: ^5.0.0
  firebase_database: ^11.1.2
  dialogflow_flutter: ^1.0.0
  rxdart: ^0.28.0
  animated_toggle_switch: ^0.8.2
  flutter_treeview: ^1.0.7+1
  panorama_viewer: ^1.0.3
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  camera: 0.10.6
  animated_tree_view: ^2.2.1
  graphview: ^1.2.0
  org_chart: ^3.1.0
  zoom_tap_animation: ^1.1.0
  gif_view: ^0.3.1
  salomon_bottom_bar: ^3.3.2
  concentric_transition: ^1.0.3
  swipe_refresh: ^1.1.2
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  flutter_svg: ^2.0.9
  rive: ^0.13.13
  custom_refresh_indicator: ^4.0.1
  camera_360: ^1.0.9
  #gallery_saver: ^2.3.2
  oauth2: ^2.0.2
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  flutter_local_notifications: ^18.0.1
  #native_webview: ^1.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/.
    - assets/subfields/.
    - assets/icons/.
    - assets/logo/.
    - assets/images/.
    - assets/likes/.
    - assets/profiles/.
    - assets/icons/.
    - assets/icons/person_icon.png
    - assets/icons/user.png
    - assets/icons/user1.png
    - lib/vr/vr.jpg
    - lib/vr/vr1.jpg
    - lib/vr/vr2.jpg
    - assets/logo.gif
    - assets/onboard/onBoard1.jpg
    - assets/onboard/onBoard2.png
    - assets/onboard/onBoard3.png
    - assets/raster-graphics-example.riv
    - assets/chatbot.png

  fonts:
    - family: Dubai
      fonts:
        - asset: assets/fonts/Dubai-Medium.ttf
          weight: 500
        - asset: assets/fonts/Dubai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Dubai-Light.ttf
          weight: 300
        - asset: assets/fonts/Dubai-Regular.ttf
          weight: 400

    - family: Orbitron
      fonts:
        - asset: assets/fonts/orbitron/Orbitron-Black.ttf
          weight: 900
        - asset: assets/fonts/orbitron/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/orbitron/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/fonts/orbitron/Orbitron-Regular.ttf
          weight: 400

